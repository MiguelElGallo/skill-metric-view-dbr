version: 1.1
source: samples.tpch.orders
joins:
  - name: customers
    source: samples.tpch.customer
    on: source.o_custkey = customers.c_custkey
    cardinality: many_to_one
    joins:
      - name: customer_orders
        source: samples.tpch.orders
        on: customers.c_custkey = customer_orders.o_custkey
        cardinality: one_to_many
fields:
  - name: order_status
    expr: source.o_orderstatus
measures:
  - name: order_count
    expr: COUNT(*)
