version: 1.1
source: samples.tpch.orders
parameters:
  - name: window_size
    data_type: int
    default: 7
fields:
  - name: order_date
    expr: o_orderdate
measures:
  - name: rolling_customers
    expr: COUNT(DISTINCT o_custkey)
    window:
      - order: order_date
        range: trailing window_size day inclusive
        semiadditive: last
        offset: -1 day
