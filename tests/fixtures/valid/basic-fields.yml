version: 1.1
source: samples.tpch.orders
comment: Orders metrics for local checker acceptance
fields:
  - name: order_date
    expr: o_orderdate
    display_name: Order Date
    format:
      type: date
      date_format: year_month_day
  - name: order_priority
    expr: o_orderpriority
    synonyms: [priority, order urgency]
measures:
  - name: order_count
    expr: COUNT(*)
    display_name: Order Count
  - name: total_revenue
    expr: SUM(o_totalprice)
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
