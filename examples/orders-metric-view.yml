version: 1.1
source: samples.tpch.orders
comment: Order counts and stored order values grouped by source attributes.

fields:
  - name: order_status
    expr: o_orderstatus
    comment: Status code stored on the order.
  - name: order_priority
    expr: o_orderpriority
    comment: Priority value stored on the order.

measures:
  - name: order_count
    expr: COUNT(*)
    comment: Number of orders.
  - name: total_order_value
    expr: SUM(o_totalprice)
    comment: Sum of the stored order total.
